name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: pytest backend/tests
      # The DDL snapshot is generated from the ORM models; fail if someone changed a
      # model without regenerating it.
      - name: database/schema/schema.sql is in sync with the models
        run: |
          cd backend && PYTHONPATH=. python ../database/schema/export_schema.py
          cd .. && git diff --exit-code database/schema/schema.sql

  ml-contracts:
    name: ML contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema pandas numpy
      - run: pytest tests/ml
      - run: python ai/feature_engineering/build_feature_schema_contract.py && git diff --exit-code docs/api/feature_schema_contract.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-config:
    name: docker-compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
